<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AdSense Ad</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .ad-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="ad-container">
        <!-- AdSense広告コードをここに配置 -->
        <!-- Google AdSenseのコードを取得してここに貼り付けてください -->
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="XXXXXXXXXX"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
</body>
</html>
